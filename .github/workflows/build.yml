name: Build Flutter App

on:
  # 手动触发 - 点一下就打包
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: false
        default: ''
      build_android:
        description: '构建 Android APK'
        type: boolean
        default: true
      build_ios:
        description: '构建 iOS (未签名)'
        type: boolean
        default: false
      build_macos:
        description: '构建 macOS'
        type: boolean
        default: false
      build_web:
        description: '构建 Web'
        type: boolean
        default: true

  # Tag 触发 - 推送 v* tag 自动打包
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  # 从 tag 或输入获取版本号
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: 获取版本号
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # 从 tag 获取版本号 (去掉 v 前缀)
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            # 从手动输入获取
            VERSION=${{ github.event.inputs.version }}
          else
            # 默认版本
            VERSION="1.0.0"
          fi
          # 构建号使用 GitHub run number
          BUILD_NUMBER=${{ github.run_number }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}+${BUILD_NUMBER}"

  # Android APK 构建
  build-android:
    needs: prepare
    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 创建 .env 文件
        run: |
          echo "# Auto generated by CI" > .env
          echo "APP_VERSION=${{ needs.prepare.outputs.version }}" >> .env

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 APK
        run: |
          flutter build apk --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: 构建 APK (分架构)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ needs.prepare.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # iOS 构建 (未签名)
  build-ios:
    needs: prepare
    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_ios == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 创建 .env 文件
        run: |
          echo "# Auto generated by CI" > .env
          echo "APP_VERSION=${{ needs.prepare.outputs.version }}" >> .env

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 iOS (未签名)
        run: |
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: 打包 iOS App
        run: |
          mkdir -p build/ios-output
          cp -r build/ios/iphoneos/Runner.app build/ios-output/
          cd build/ios-output
          zip -r ../CherryReader-ios-${{ needs.prepare.outputs.version }}.zip Runner.app

      - name: 上传 iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ needs.prepare.outputs.version }}
          path: build/CherryReader-ios-*.zip
          retention-days: 30

  # macOS 构建
  build-macos:
    needs: prepare
    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_macos == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 创建 .env 文件
        run: |
          echo "# Auto generated by CI" > .env
          echo "APP_VERSION=${{ needs.prepare.outputs.version }}" >> .env

      - name: 获取依赖
        run: flutter pub get

      - name: 启用 macOS 桌面支持
        run: flutter config --enable-macos-desktop

      - name: 构建 macOS
        run: |
          flutter build macos --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: 打包 macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../CherryReader-macos-${{ needs.prepare.outputs.version }}.zip "Cherry Reader.app" || \
          zip -r ../../../../../CherryReader-macos-${{ needs.prepare.outputs.version }}.zip *.app

      - name: 上传 macOS App
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ needs.prepare.outputs.version }}
          path: CherryReader-macos-*.zip
          retention-days: 30

  # Web 构建
  build-web:
    needs: prepare
    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 创建 .env 文件
        run: |
          echo "# Auto generated by CI" > .env
          echo "APP_VERSION=${{ needs.prepare.outputs.version }}" >> .env

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Web
        run: |
          flutter build web --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: 打包 Web
        run: |
          cd build
          zip -r ../CherryReader-web-${{ needs.prepare.outputs.version }}.zip web

      - name: 上传 Web
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ needs.prepare.outputs.version }}
          path: CherryReader-web-*.zip
          retention-days: 30

  # 创建 Release (仅 tag 触发时)
  release:
    needs: [prepare, build-android, build-web]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 显示下载的文件
        run: ls -R artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          name: Cherry Reader v${{ needs.prepare.outputs.version }}
          body: |
            ## Cherry Reader v${{ needs.prepare.outputs.version }}

            ### 下载
            - **Android**: 下载 APK 文件直接安装
            - **Web**: 解压后部署到 Web 服务器

            ### 更新内容
            请查看 commit 记录
          files: |
            artifacts/**/*.apk
            artifacts/**/*.zip
          draft: false
          prerelease: false
