<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>对话详情</title>
    <!-- Prism.js 主题样式 -->
    <link rel="stylesheet" href="./vendor/prism-tomorrow.min.css" />
    <!-- 主样式 -->
    <link rel="stylesheet" href="./conversation.css" />
    <!-- 高亮样式 -->
    <link rel="stylesheet" href="./highlight.css" />
  </head>
  <body class="theme-light has-sidebar">
    <!-- 大纲导航侧边栏 (固定悬浮) -->
    <aside id="outline-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">
          <svg
            class="sidebar-title-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M8 6h13"></path>
            <path d="M8 12h13"></path>
            <path d="M8 18h13"></path>
            <path d="M3 6h.01"></path>
            <path d="M3 12h.01"></path>
            <path d="M3 18h.01"></path>
          </svg>
          <span class="sidebar-title-text">大纲</span>
        </span>
        <div class="sidebar-actions">
          <button
            class="sidebar-action outline-mode-toggle"
            type="button"
            title="密集/舒展"
            aria-label="切换紧凑/详情显示"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 6h16"></path>
              <path d="M4 12h10"></path>
              <path d="M4 18h16"></path>
            </svg>
          </button>
          <button
            class="sidebar-action outline-expand-toggle"
            type="button"
            title="展开/折叠全部"
            aria-label="展开或折叠全部"
          >
            <svg
              class="outline-expand-toggle-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14"></path>
              <path class="expand-vertical" d="M12 5v14"></path>
            </svg>
          </button>
        </div>
      </div>
      <nav class="outline-nav">
        <!-- 通过 JS 动态生成 -->
      </nav>
    </aside>

    <button class="sidebar-handle" aria-label="展开或收起侧边栏">
      <svg
        class="sidebar-handle-icon"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 18l6-6-6-6"></path>
      </svg>
    </button>

    <!-- 主内容区 -->
    <main id="conversation-container">
      <!-- 问题和回复通过 JS 动态生成 -->
    </main>

    <!-- 底部悬浮工具栏 -->
    <footer id="content-toolbar">
      <div class="toolbar-inner">
        <div class="reply-nav">
          <button class="nav-btn prev" title="上一个回复">◀</button>
          <span class="reply-indicator">1/3</span>
          <button class="nav-btn next" title="下一个回复">▶</button>
        </div>
        <div class="toolbar-divider"></div>
        <button class="action-btn tts" title="朗读">
          <span class="icon">🎧</span>
          <span class="label">朗读</span>
        </button>
        <button class="action-btn discuss" title="讨论">
          <span class="icon">💬</span>
          <span class="label">讨论</span>
        </button>
        <button class="action-btn copy" title="复制">
          <span class="icon">📋</span>
          <span class="label">复制</span>
        </button>
      </div>
    </footer>

    <!-- 选中文本工具栏（高亮/标注/复制） -->
    <div
      id="highlight-toolbar"
      class="hidden"
      role="toolbar"
      aria-label="选中文本操作"
    >
      <div class="highlight-toolbar-inner">
        <button class="toolbar-action" data-action="copy" type="button">
          复制
        </button>
        <button class="toolbar-action" data-action="annotate" type="button">
          批注
        </button>
        <button
          class="color"
          data-color="#FFF176"
          style="--dot-color: #fff176"
          type="button"
          title="黄色"
        ></button>
        <button
          class="color"
          data-color="#81C784"
          style="--dot-color: #81c784"
          type="button"
          title="绿色"
        ></button>
        <button
          class="color"
          data-color="#64B5F6"
          style="--dot-color: #64b5f6"
          type="button"
          title="蓝色"
        ></button>
        <button
          class="color"
          data-color="#E57373"
          style="--dot-color: #e57373"
          type="button"
          title="红色"
        ></button>
        <button
          class="color"
          data-color="#BA68C8"
          style="--dot-color: #ba68c8"
          type="button"
          title="紫色"
        ></button>
      </div>
    </div>

    <!-- 高亮编辑弹窗（微信读书风格）-->
    <div id="highlight-editor" class="hidden">
      <div class="editor-bar">
        <!-- 样式选择：背景高亮 A 按钮 -->
        <button class="style-toggle" data-style="background" title="背景高亮">
          <span class="style-icon bg-style">A</span>
        </button>
        <!-- 样式选择：下划线 A 按钮 -->
        <button class="style-toggle" data-style="underline" title="下划线">
          <span class="style-icon ul-style">A</span>
        </button>
        <!-- 分隔符 -->
        <div class="bar-divider"></div>
        <!-- 颜色选择 -->
        <button
          class="color-dot"
          data-color="#FFF176"
          style="--dot-color: #fff176"
          title="黄色"
        ></button>
        <button
          class="color-dot"
          data-color="#81C784"
          style="--dot-color: #81c784"
          title="绿色"
        ></button>
        <button
          class="color-dot"
          data-color="#64B5F6"
          style="--dot-color: #64b5f6"
          title="蓝色"
        ></button>
        <button
          class="color-dot"
          data-color="#E57373"
          style="--dot-color: #e57373"
          title="红色"
        ></button>
        <button
          class="color-dot"
          data-color="#BA68C8"
          style="--dot-color: #ba68c8"
          title="紫色"
        ></button>
        <!-- 分隔符 -->
        <div class="bar-divider"></div>
        <!-- 操作按钮 -->
        <button class="action-icon copy" title="复制">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path
              d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
            ></path>
          </svg>
        </button>
        <button class="action-icon delete" title="删除">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="3 6 5 6 21 6"></polyline>
            <path
              d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- 第三方库 -->
    <script src="./vendor/markdown-it.min.js"></script>
    <script src="./vendor/prism-core.min.js"></script>
    <script src="./vendor/prism-autoloader.min.js"></script>

    <!-- 主逻辑 -->
    <script src="./conversation.js"></script>
    <!-- 高亮管理器 -->
    <script src="./highlight-manager.js"></script>
  </body>
</html>
